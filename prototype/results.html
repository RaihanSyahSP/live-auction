<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hasil Lelang: Lelang</title>
    <meta name="description" content="Arsip hasil lelang elektronik bekas.">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="results.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#results-main">Lewati ke konten</a>

    <div class="page">
      <header class="masthead">
        <div class="masthead-brand">
          <p class="wordmark">LELANG</p>
          <p class="wordmark-note">Arsip hasil lelang</p>
        </div>
        <div class="masthead-meta">
          <p class="lot-id">HASIL</p>
          <a class="text-link" href="index.html">Buka ruang lelang</a>
          <div class="auth-links" id="auth-links"></div>
        </div>
      </header>

      <main id="results-main" class="results" aria-busy="true">
        <div class="results-head">
          <p class="kicker">Arsip</p>
          <h1>Hasil lelang</h1>
          <p class="admin-summary" id="results-summary">Memuat...</p>
        </div>

        <p class="ledger-loading" id="results-loading">Memuat hasil lelang...</p>
        <div class="results-list" id="results-list"></div>

        <div class="results-empty" id="results-empty" hidden>
          <p>Belum ada lelang yang selesai.</p>
          <a class="text-link" href="index.html">Buka ruang lelang</a>
        </div>
      </main>

      <footer class="footer">
        <div class="footer-copy">
          <p>Hasil diambil dari state demo yang tersimpan di browser ini.</p>
        </div>
        <div class="demo-controls">
          <a class="text-link" href="admin.html">Buka admin demo</a>
        </div>
      </footer>
    </div>

    <noscript><p class="noscript">Halaman hasil lelang ini memerlukan JavaScript.</p></noscript>
  </body>
</html>
